Port: 8082 # 端口
AllowedOrigins:
  - "*"
Installed: false # 是否已完成安装

# 数据下载 https://github.com/lionsoul2014/ip2region/tree/master/data
IPLocator:
  IPv4DataPath: # IPv4 数据文件（建议使用 ip2region_v4.xdb）
  IPv6DataPath: # IPv6 数据文件（建议使用 ip2region_v6.xdb）

# ID 编解码秘钥（安装时自动生成）
IdCodec:
  Key: 0

# 日志配置
Logger:
  Filename: /data/logs/bbs-go.log   # 日志文件的位置
  MaxSize: 100                      # 文件最大尺寸（以MB为单位）
  MaxAge: 10                        # 保留旧文件的最大天数
  MaxBackups: 10                    # 保留的最大旧文件数量

# 数据库连接
DB:
  Url: username:password@tcp(localhost:3306)/bbsgo_db?charset=utf8mb4&parseTime=True&multiStatements=true&loc=Local
  MaxIdleConns: 50
  MaxOpenConns: 200
  LogLevel: warn # SQL日志级别：silent、error、warn、info

# search
Search:
  IndexPath: # 索引路径

# Jev System One 智能内容风控
Jev:
  Enabled: false                                   # 是否启用 Jev 智能风控
  ApiKey:                                          # TypeSafe API Key
  Endpoint: https://api.typesafe.ai/v1/systemone   # Jev API 接口地址
  Model: jev-latest                                # 使用的模型
  TimeoutMs: 3000                                  # 请求超时毫秒数
  AutoRejectScoreThreshold: 1.5                    # 自动驳回下架的严重程度阈值 (Score 0~2)
  AutoRejectSpamThreshold: 0.85                    # 自动驳回下架的垃圾概率阈值 (Noul 0~1)
  AutoReviewScoreThreshold: 0.8                    # 自动转人工待审的严重程度阈值 (Score 0~2)
  AutoReviewSpamThreshold: 0.45                    # 自动转人工待审的垃圾概率阈值 (Noul 0~1)

